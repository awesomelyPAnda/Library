<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top">
        <h1 class="title">panda's bamboo library</h1>
        <img src="assets/favicons/panda-bear.png" class="panda">
    </div>
    <div class="bottom">
        <div class="book-container">

        </div>
        <button class="new-btn"><img src="assets/favicons/library_add_150dp_495057_FILL0_wght400_GRAD0_opsz48.svg" class="add-btn"></button>
        <div id="overlay" class="overlay hide"></div>
        <div id="form" class="popover hide">
            <form>
                <h2>New Bamboo</h2>
                <input type="text" id="title" placeholder="Name" class="text" required>
                <input type="text" id="origin" placeholder="Origin" class="text" required>
                <input type="number" min="2" max="10000" id="pages" placeholder="Number of Stalks" class=text required>
                <label for="read">Have you tasted the bamboo yet?</label>
                <input type="checkbox" id="read">
                <button type="button" id="submit">Add</button>
            </form>
        </div>

    </div>
</body>
<script defer src="assets/js/script.js"></script>
</html>
